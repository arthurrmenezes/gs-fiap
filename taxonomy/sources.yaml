# SpecRadar — source allowlist, ordered by AUTHORITY.
#
# tier 1 wins in coalesce. Resolution is restricted to this allowlist: a URL
# whose domain is not listed here is never fetched. Respect robots.txt / ToS;
# prefer official/structured data over aggressive scraping.
#
# kind ∈ {oem, price, efficiency, aggregator, editorial}
# tier: 1 (highest authority) .. 4 (lowest)

version: 1

