# SpecRadar — source term → canonical mapping.
#
# Sources are Brazilian (PT-BR), so the PT→canonical map is essential. Two maps:
#
#   attributes: free/source attribute label  → canonical attribute id
#   values:     per-attribute, source value  → canonical value (from its value_set)
#
# Matching is case-insensitive and accent-insensitive (see normalization/categorical.py).

version: 1

# --- free attribute label → canonical attribute id --------------------------
attributes:
  "potencia": engine.power_cv
  "potencia maxima": engine.power_cv
  "cavalos": engine.power_cv
  "cv": engine.power_cv
  "torque": engine.torque_nm
  "torque maximo": engine.torque_nm
  "cilindrada": engine.displacement_l
  "motor": engine.configuration
  "motorizacao": engine.configuration
  "combustivel": engine.fuel
  "cambio": transmission
  "transmissao": transmission
  "marchas": transmission.gears
  "quantidade de marchas": transmission.gears
  "tracao": drivetrain
  "tracao 4x4": drivetrain
  "tracao integral": drivetrain
  "modos de conducao": drive_modes
  "drive modes": drive_modes
  "modos de direcao": steering_modes
  "modos de escapamento": exhaust_modes
  "modos de amortecimento": damper_modes
  "0 a 100": performance.0_100_kmh_s
  "0-100": performance.0_100_kmh_s
  "aceleracao": performance.0_100_kmh_s
  "velocidade maxima": performance.top_speed_kmh
  "consumo urbano": fuel.consumption_city_kml
  "consumo cidade": fuel.consumption_city_kml
  "consumo rodoviario": fuel.consumption_road_kml
  "consumo estrada": fuel.consumption_road_kml
  "emissao de co2": emissions.co2_gkm
  "amortecedores": suspension.dampers
  "suspensao dianteira": suspension.front
  "suspensao traseira": suspension.rear
  "freios dianteiros": brakes.front
  "freios traseiros": brakes.rear
  "pneus": wheels.tires
  "pneu": wheels.tires
  "aro": wheels.rim_diameter_in
  "rodas": wheels.material
  "comprimento": dimensions.length_mm
  "entre-eixos": dimensions.wheelbase_mm
  "entre eixos": dimensions.wheelbase_mm
  "distancia entre-eixos": dimensions.wheelbase_mm
  "altura livre do solo": dimensions.ground_clearance_mm
  "vao livre do solo": dimensions.ground_clearance_mm
  "peso": capacity.curb_weight_kg
  "peso em ordem de marcha": capacity.curb_weight_kg
  "carga util": capacity.payload_kg
  "capacidade de carga": capacity.payload_kg
  "capacidade de reboque": capacity.towing_kg
  "reboque": capacity.towing_kg
  "tanque": capacity.fuel_tank_l
  "tanque de combustivel": capacity.fuel_tank_l
  "carroceria": body.style
  "cabine": body.style
  "lugares": body.seats
  "ocupantes": body.seats
  "farois": headlights
  "farol": headlights
  "multimidia": infotainment.screen_in
  "central multimidia": infotainment.screen_in
  "tela": infotainment.screen_in
  "painel digital": infotainment.cluster_in
  "quadro de instrumentos": infotainment.cluster_in
  "airbags": safety.airbags
  "teto solar": features.sunroof
  "bancos": features.seat_material
  "revestimento": features.seat_material
  "bloqueio de diferencial": offroad.diff_lock
  "diferencial blocante": offroad.diff_lock
  "garantia": warranty.years
  "preco": price.brl
  "preco sugerido": price.brl
  "valor": price.brl

