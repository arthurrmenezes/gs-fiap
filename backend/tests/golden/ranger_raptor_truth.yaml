# Golden acceptance gabarito — Ford Ranger Raptor (CLAUDE.md §14).
# This is the canonical truth the pipeline is compared against, field by field.
# Validates: the 5 hard data types, identical output format, price.brl flagged
# as ANOMALY, and an absent field as explicit NA.

vehicle:
  make: Ford
  model: Ranger Raptor
  version: Raptor 3.0 V6
  year: 2026

expected:
  # --- COMPOSITE ---
  engine.configuration:
    data_type: COMPOSITE
    status: OK
    value:
      layout: V
      cylinders: 6
      displacement_l: 3.0
      aspiration: Biturbo

  transmission:
    data_type: COMPOSITE
    status: OK
    value:
      type: Automática
      gears: 10
      paddle_shifters: true

  # --- SCALAR_UNIT ---
  engine.power_cv:
    data_type: SCALAR_UNIT
    status: OK
    value: 397.0
    unit: cv

  engine.torque_nm:
    data_type: SCALAR_UNIT
    status: OK
    value: 583.0   # the icarros hallucination (600 Nm) is discarded by the verifier
    unit: Nm

  performance.0_100_kmh_s:
    data_type: SCALAR_UNIT
    status: OK
    value: 5.8
    unit: s

  # --- CATEGORICAL ---
  drivetrain:
    data_type: CATEGORICAL
    status: OK
    value: "4WD"

  headlights:
    data_type: CATEGORICAL
    status: OK
    value: "Matrix LED"

  # --- DIMENSIONAL ---
  wheels.tires:
    data_type: DIMENSIONAL
    status: OK
    value:
      width: 285
      aspect_ratio: 70
      rim_diameter_in: 17

  # --- ENUM_LIST (all four mode families) ---
  drive_modes:
    data_type: ENUM_LIST
    status: OK
    value: [Normal, Sport, Slippery, Mud, Sand, "Rock Crawl", Baja]

  steering_modes:
    data_type: ENUM_LIST
    status: OK
    value: [Normal, Sport, Comfort]

  exhaust_modes:
    data_type: ENUM_LIST
    status: OK
    value: [Normal, Quiet, Sport, Baja]

  damper_modes:
    data_type: ENUM_LIST
    status: OK
    value: [Normal, Sport, Baja]

  # --- TEXT ---
  suspension.dampers:
    data_type: TEXT
    status: OK
    value: "FOX Racing Live Valve 2.5\""

  # --- ANOMALY (the planted R$ 499 error must be flagged automatically) ---
  price.brl:
    data_type: SCALAR_UNIT
    status: ANOMALY
    value: 499.0
    unit: BRL

  # --- NA (absent attribute is explicit, never omitted/guessed) ---
  emissions.co2_gkm:
    data_type: SCALAR_UNIT
    status: NA
    value: null
