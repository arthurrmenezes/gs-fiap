[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specradar"
version = "1.0.0"
description = "SpecRadar backend (FastAPI) — standardized vehicle spec sheets for the mobile app."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — FIAP x Ford academic project" }
authors = [{ name = "FIAP x Ford — SpecRadar team" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=0.49",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
]

[project.scripts]
specradar = "specradar.pipeline.orchestrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specradar = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# RUF001/002/003: ambiguous unicode (–, ×, →, →) is intentional in PT-BR prose/docs.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["specradar"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["specradar"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "golden: end-to-end acceptance tests (Ranger Raptor). Merge gate.",
    "network: tests that require real network/LLM/BigQuery access.",
]
